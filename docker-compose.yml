services:
  gbootcms:
    build: .
    image: gbootcms:local
    ports:
      - "8082:8080"
    environment:
      # runtime config is written to the data volume on /install (see entrypoint)
      GBOOT_ADDR: ":8080"
      TZ: Asia/Shanghai
      # MySQL/Pg example (create empty DB first, then open /install):
      # GBOOT_DRIVER: mysql
      # GBOOT_DSN: user:pass@tcp(db:3306)/gbootcms?parseTime=true&charset=utf8mb4
    volumes:
      - gboot_data:/app/site/data
      - gboot_upload:/app/site/static/upload
      - gboot_backup:/app/site/static/backup
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=8m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # entrypoint needs these briefly to chown volumes then su-exec → gboot
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
    restart: unless-stopped

volumes:
  gboot_data:
  gboot_upload:
  gboot_backup:
